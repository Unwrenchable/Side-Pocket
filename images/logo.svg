<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" role="img" aria-label="Side Pocket Apparel logo">
  <defs>
    <!-- Blue gradient for APPAREL block letters -->
    <linearGradient id="apparelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1e3a6e"/>
      <stop offset="35%"  stop-color="#2563eb"/>
      <stop offset="65%"  stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e3a6e"/>
    </linearGradient>
    <!-- Shine / highlight overlay -->
    <linearGradient id="shineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="white" stop-opacity="0.18"/>
      <stop offset="45%"  stop-color="white" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <!-- Drop shadow filter for APPAREL -->
    <filter id="shadowApparel" x="-5%" y="-5%" width="115%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#0a1628" flood-opacity="0.7"/>
    </filter>
    <!-- Drop shadow for script -->
    <filter id="shadowScript" x="-5%" y="-5%" width="120%" height="130%">
      <feDropShadow dx="1.5" dy="2" stdDeviation="1.5" flood-color="rgba(0,0,0,0.35)"/>
    </filter>
  </defs>

  <!-- ── "Side Pocket" script text ── -->
  <!-- Rendered with system cursive/italic as a fallback; browsers will use
       Dancing Script if it is loaded via the page's <link> tag -->
  <text
    x="260" y="105"
    text-anchor="middle"
    font-family="'Dancing Script', 'Brush Script MT', cursive"
    font-weight="700"
    font-size="88"
    fill="#111111"
    filter="url(#shadowScript)"
    letter-spacing="-1">Side Pocket</text>

  <!-- ── "APPAREL" block letters ── -->
  <!-- Shadow layer (slight offset, dark navy) -->
  <text
    x="263" y="193"
    text-anchor="middle"
    font-family="'Inter', 'Arial Black', 'Impact', sans-serif"
    font-weight="900"
    font-size="96"
    fill="#0a1628"
    letter-spacing="2">APPAREL</text>

  <!-- Main gradient fill -->
  <text
    x="260" y="190"
    text-anchor="middle"
    font-family="'Inter', 'Arial Black', 'Impact', sans-serif"
    font-weight="900"
    font-size="96"
    fill="url(#apparelGrad)"
    filter="url(#shadowApparel)"
    letter-spacing="2">APPAREL</text>

  <!-- Shine overlay (same path, lighter color) -->
  <text
    x="260" y="190"
    text-anchor="middle"
    font-family="'Inter', 'Arial Black', 'Impact', sans-serif"
    font-weight="900"
    font-size="96"
    fill="url(#shineGrad)"
    letter-spacing="2">APPAREL</text>
</svg>
